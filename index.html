<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
    <title>Landwalk</title>
</head>
<body>
    <header>
        <h1>Landwalk</h1>
    </header>
    <main>
        <section>
            <form>
                <fieldset>
                    <legend>Search Box</legend>
                    <label for="search">Search for a card (<a href="https://scryfall.com/docs/syntax" target="_blank">Scryfall Syntax</a>)</label>
                    <input id="search" type="search">
                    <button id="search-button" type="button">Search</button>
                    <button id="clear-button" type="button">Clear Cards</button>
                </fieldset>
            </form>
        </section>
        <section id="card-container" aria-hidden="false" aria-live="polite">
            
        </section>
    </main>
    <footer>
        <p>Landwalk made by <a target="_blank" href="http://github.com/charlierw1">Charlie Wightman</a></p>
    </footer>
    <!-- Enlarged Card Follower -->
    <div id="card-enlarger" class="card-enlarger">
        <img id="enlarger-card-image" src="" alt="">
    </div>
</body>
</html>
